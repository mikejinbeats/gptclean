<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Chaves de Licença - ChatGPT Clean PRO</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    h1 {
      font-size: 20px;
      color: #f59e0b;
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    p {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }
    select, button {
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
    }
    select {
      background: #1f2937;
      color: #fff;
      border: 1px solid #374151;
      flex: 1;
    }
    button {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      border: none;
      cursor: pointer;
      transition: transform 0.15s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    textarea {
      width: 100%;
      height: 220px;
      background: #030712;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #38bdf8;
      font-family: Consolas, monospace;
      font-size: 13px;
      padding: 12px;
      box-sizing: border-box;
      resize: vertical;
    }
    .copy-btn {
      width: 100%;
      margin-top: 10px;
      background: #1f2937;
      color: #38bdf8;
      border: 1px solid #38bdf8;
    }
    .copy-btn:hover {
      background: #38bdf8;
      color: #000;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>👑 Gerador de Licenças PRO</h1>
    <p>Gera chaves válidas no formato <code>PRO-XXXX-YYYY</code> para entregares aos teus clientes após a compra (Stripe, Gumroad, Lemon Squeezy, Kiwify, etc).</p>
    
    <div class="controls">
      <select id="keyCount">
        <option value="1">1 Chave Única</option>
        <option value="10">10 Chaves</option>
        <option value="50" selected>50 Chaves (Lote)</option>
        <option value="100">100 Chaves (Lote)</option>
        <option value="500">500 Chaves (Para Gumroad / Lemon Squeezy)</option>
      </select>
      <button id="btnGenerate">Gerar Chaves</button>
    </div>

    <textarea id="output" placeholder="As chaves geradas vão aparecer aqui..." readonly></textarea>
    <button class="copy-btn" id="btnCopy">📋 Copiar Todas as Chaves</button>
  </div>

  <script>
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    function testChecksum(p1, p2) {
      let sum1 = 0, sum2 = 0;
      for (let i = 0; i < p1.length; i++) sum1 += p1.charCodeAt(i);
      for (let i = 0; i < p2.length; i++) sum2 += p2.charCodeAt(i);
      return ((sum1 + sum2) % 7 === 0 || sum1 % 3 === 0);
    }

    function randomPart() {
      let res = "";
      for (let i = 0; i < 4; i++) {
        res += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return res;
    }

    function generateKeys(count) {
      const keys = new Set();
      while (keys.size < count) {
        const p1 = randomPart();
        const p2 = randomPart();
        if (testChecksum(p1, p2)) {
          keys.add(`PRO-${p1}-${p2}`);
        }
      }
      return Array.from(keys);
    }

    document.getElementById('btnGenerate').addEventListener('click', () => {
      const count = parseInt(document.getElementById('keyCount').value);
      const keys = generateKeys(count);
      document.getElementById('output').value = keys.join('\n');
    });

    document.getElementById('btnCopy').addEventListener('click', () => {
      const text = document.getElementById('output').value;
      if (!text) return;
      navigator.clipboard.writeText(text);
      const btn = document.getElementById('btnCopy');
      btn.innerText = '✅ Chaves Copiadas!';
      setTimeout(() => { btn.innerText = '📋 Copiar Todas as Chaves'; }, 2000);
    });

    // Gerar logo ao abrir
    document.getElementById('btnGenerate').click();
  </script>
</body>
</html>
